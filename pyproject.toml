[project]
name = "pulsegrid-sensor-etl"
version = "0.1.0"
description = "PulseGrid: AWS batch data pipeline for mixed-fleet IoT sensor telemetry"
requires-python = ">=3.10"
dependencies = [
    "faker",
    "boto3",
    "pydantic",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
